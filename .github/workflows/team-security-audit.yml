name: Team Security Audit

on:
  pull_request:
    branches:
      - main
      - "defend/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: team-security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ROOT: cicd_practice
  BACKEND_DIR: cicd_practice/backend
  FRONTEND_DIR: cicd_practice/frontend
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  DEPENDENCY_CHECK_CVSS: "7.0"
  NPM_AUDIT_LEVEL: high

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Maven test
        working-directory: ${{ env.BACKEND_DIR }}
        run: mvn -B -ntp test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint --if-present
      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: OWASP Dependency-Check
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp -DskipTests org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=${DEPENDENCY_CHECK_CVSS} \
            -Dformats=HTML,JSON,SARIF \
            ${NVD_API_KEY:+-Dnvd.api.key=$NVD_API_KEY}
      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ${{ env.BACKEND_DIR }}/target/dependency-check-report.*
          if-no-files-found: ignore
      - name: Upload Dependency-Check SARIF
        if: always() && hashFiles(format('{0}/target/dependency-check-report.sarif', env.BACKEND_DIR)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.BACKEND_DIR }}/target/dependency-check-report.sarif
          category: dependency-check

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --no-audit --no-fund
      - name: Generate npm audit JSON
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm audit --omit=dev --json > npm-audit.json || true
      - name: Fail on high or critical vulnerabilities
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm audit --omit=dev --audit-level=${{ env.NPM_AUDIT_LEVEL }}
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: ${{ env.FRONTEND_DIR }}/npm-audit.json
          if-no-files-found: ignore

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          set +e
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/java \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --error "${PROJECT_ROOT}"
          status=$?
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/java \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --json --output semgrep.json \
            "${PROJECT_ROOT}" || true
          exit "$status"
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: ignore

  trivy:
    name: Trivy fs/config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT_ROOT }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
      - name: Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT_ROOT }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-results.sarif
            trivy-results.json
          if-no-files-found: ignore

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  custom-owasp-scan:
    name: Custom OWASP scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run custom scanner
        run: |
          python .github/scripts/security_custom_scan.py \
            --root "${PROJECT_ROOT}" \
            --out security-custom-scan.json \
            --fail-on high
      - name: Upload custom scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-owasp-scan
          path: security-custom-scan.json
          if-no-files-found: error

  security-report:
    name: Security report
    needs:
      - backend-test
      - frontend-build
      - dependency-scan
      - npm-audit
      - semgrep
      - trivy
      - gitleaks
      - custom-owasp-scan
    if: always()
    runs-on: ubuntu-latest
    outputs:
      has_blockers: ${{ steps.report.outputs.has_blockers }}
    steps:
      - uses: actions/checkout@v4
      - name: Download custom scan report
        uses: actions/download-artifact@v4
        with:
          name: custom-owasp-scan
          path: .
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate security report
        id: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CUSTOM_SCAN_JSON: security-custom-scan.json
          BACKEND_TEST_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          NPM_AUDIT_RESULT: ${{ needs.npm-audit.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CUSTOM_SCAN_RESULT: ${{ needs.custom-owasp-scan.result }}
        run: python .github/scripts/security_report.py
      - name: Append report to job summary
        if: always()
        run: cat security-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload consolidated security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          if-no-files-found: error

  security-gate:
    name: Security gate
    needs: security-report
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Block unsafe PRs
        env:
          HAS_BLOCKERS: ${{ needs.security-report.outputs.has_blockers }}
        run: |
          if [ "$HAS_BLOCKERS" = "true" ]; then
            echo "::error::Security blockers found. Review the Security report job and uploaded artifacts."
            exit 1
          fi
          echo "Security gate passed."

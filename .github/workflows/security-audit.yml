name: Security Audit (defend/david)

on:
  pull_request:
    branches:
      - defend/david

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend - Maven test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven test
        run: mvn -B -ntp test

  backend-dependency-check:
    name: Backend - OWASP Dependency-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run dependency-check (fails build on CVSS >= 9.0)
        run: mvn -B -ntp -DskipTests org.owasp:dependency-check-maven:check
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check
          path: cicd_practice/backend/target/dependency-check-report.*
          if-no-files-found: ignore

  frontend-audit:
    name: Frontend - npm audit & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cicd_practice/frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm audit JSON report
        if: always()
        run: npm audit --omit=dev --json > npm-audit.json || true
      - name: npm audit (fail on critical, report high)
        run: npm audit --omit=dev --audit-level=critical
      - name: Build
        if: always()
        run: npm run build
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit
          path: cicd_practice/frontend/npm-audit.json
          if-no-files-found: ignore

  semgrep:
    name: SAST - Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (OWASP Top 10 + secrets + framework rules)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/java \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --sarif --output=semgrep.sarif \
            --error
      - name: Upload Semgrep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload Semgrep report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  trivy-fs:
    name: Trivy - filesystem & config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          output: trivy-fs-critical.txt
      - name: Trivy filesystem report (HIGH/MEDIUM, report only)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,MEDIUM
          exit-code: '0'
          ignore-unfixed: true
          format: table
          output: trivy-fs-high.txt
      - name: Trivy config scan (IaC / Dockerfile)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table
          output: trivy-config.txt
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-fs-critical.txt
            trivy-fs-high.txt
            trivy-config.txt
          if-no-files-found: ignore

  pr-summary:
    name: PR summary comment
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-test
      - backend-dependency-check
      - frontend-audit
      - semgrep
      - gitleaks
      - trivy-fs
    steps:
      - name: Compose summary
        id: compose
        run: |
          {
            echo "summary<<__END__"
            echo "## Security Audit (defend/david)"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Backend Maven test | ${{ needs.backend-test.result }} |"
            echo "| OWASP Dependency-Check (Java) | ${{ needs.backend-dependency-check.result }} |"
            echo "| npm audit + build | ${{ needs.frontend-audit.result }} |"
            echo "| Semgrep (OWASP Top 10) | ${{ needs.semgrep.result }} |"
            echo "| Gitleaks (secrets) | ${{ needs.gitleaks.result }} |"
            echo "| Trivy (fs + config) | ${{ needs.trivy-fs.result }} |"
            echo ""
            echo "Severity policy: **CRITICAL = fail**, HIGH/MEDIUM = report-only artifact."
            echo "Artifacts: backend-dependency-check, frontend-npm-audit, semgrep-report, trivy-reports"
            echo "__END__"
          } >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-audit
          message: ${{ steps.compose.outputs.summary }}

name: Security Audit (defend/sabo)

on:
  pull_request:
    branches:
      - 'defend/sabo'
  push:
    branches:
      - 'defend/sabo'

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- Test jobs (run in parallel with security scans) -----

  backend-test:
    name: Backend test (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven test
        run: mvn -B test

  frontend-test:
    name: Frontend test (install + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
        continue-on-error: true

  # ----- Security scan jobs (run in parallel with tests, gate the build) -----

  owasp-dependency-check:
    name: OWASP Dependency-Check (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: OWASP Dependency-Check (failBuildOnCVSS=7)
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: cicd_practice/backend/target/dependency-check-report.*
          if-no-files-found: ignore

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: npm audit JSON
        if: always()
        run: npm audit --json > npm-audit.json || true
      - name: Fail on high
        run: npm audit --audit-level=high
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: cicd_practice/frontend/npm-audit.json
          if-no-files-found: ignore

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/java \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --severity ERROR \
            --severity WARNING \
            --error \
            --sarif --output semgrep.sarif \
            --json --output semgrep.json \
            cicd_practice
      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: ignore

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs (CRITICAL/HIGH, fail)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: cicd_practice
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table
      - name: Trivy JSON report (no fail)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: cicd_practice
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: trivy-fs.json
          exit-code: '0'
      - name: Trivy SARIF report (no fail)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: cicd_practice
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: |
            trivy-fs.json
            trivy-fs.sarif
          if-no-files-found: ignore

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----- Aggregated human-readable report -----

  security-report:
    name: Aggregate security report
    needs:
      - owasp-dependency-check
      - npm-audit
      - semgrep
      - trivy-fs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download owasp-dependency-check report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: artifacts/owasp
        continue-on-error: true

      - name: Download npm-audit report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: npm-audit-report
          path: artifacts/npm
        continue-on-error: true

      - name: Download semgrep report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: artifacts/semgrep
        continue-on-error: true

      - name: Download trivy report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: trivy-fs-report
          path: artifacts/trivy
        continue-on-error: true

      - name: Generate Markdown report
        run: |
          python3 .github/scripts/security-report-to-markdown.py \
            --owasp-dc artifacts/owasp/dependency-check-report.json \
            --npm-audit artifacts/npm/npm-audit.json \
            --semgrep artifacts/semgrep/semgrep.json \
            --trivy artifacts/trivy/trivy-fs.json \
            --output security-report.md
          echo "---- security-report.md ----"
          cat security-report.md

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md

      - name: Post security report to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-report
          path: security-report.md

  # ----- Build jobs (gated by all security scans) -----

  backend-build:
    name: Backend build (mvn package)
    runs-on: ubuntu-latest
    needs:
      - owasp-dependency-check
      - semgrep
      - trivy-fs
      - gitleaks
    defaults:
      run:
        working-directory: cicd_practice/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven package (tests already ran in parallel)
        run: mvn -B package -DskipTests
      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: cicd_practice/backend/target/*.jar
          if-no-files-found: ignore

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    needs:
      - npm-audit
      - semgrep
      - trivy-fs
      - gitleaks
    defaults:
      run:
        working-directory: cicd_practice/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: cicd_practice/frontend/dist
          if-no-files-found: ignore

  # ----- Top-level PR summary -----

  pr-comment-summary:
    name: PR security summary
    needs:
      - backend-test
      - frontend-test
      - owasp-dependency-check
      - npm-audit
      - semgrep
      - trivy-fs
      - gitleaks
      - security-report
      - backend-build
      - frontend-build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Compose summary
        id: compose
        run: |
          {
            echo "summary<<EOF"
            echo "## Security Audit Summary"
            echo ""
            echo "| Stage | Job | Result |"
            echo "| --- | --- | --- |"
            echo "| Test (parallel) | backend-test | ${{ needs.backend-test.result }} |"
            echo "| Test (parallel) | frontend-test | ${{ needs.frontend-test.result }} |"
            echo "| Security scan (parallel) | owasp-dependency-check | ${{ needs.owasp-dependency-check.result }} |"
            echo "| Security scan (parallel) | npm-audit | ${{ needs.npm-audit.result }} |"
            echo "| Security scan (parallel) | semgrep | ${{ needs.semgrep.result }} |"
            echo "| Security scan (parallel) | trivy-fs | ${{ needs.trivy-fs.result }} |"
            echo "| Security scan (parallel) | gitleaks | ${{ needs.gitleaks.result }} |"
            echo "| Aggregated report | security-report | ${{ needs.security-report.result }} |"
            echo "| Build (after scans) | backend-build | ${{ needs.backend-build.result }} |"
            echo "| Build (after scans) | frontend-build | ${{ needs.frontend-build.result }} |"
            echo ""
            echo "Detailed findings are in the security-report sticky comment above and the security-report artifact."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post summary comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-audit
          message: ${{ steps.compose.outputs.summary }}

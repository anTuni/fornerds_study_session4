name: Security Audit (defend/sabo)

on:
  pull_request:
    branches:
      - 'defend/sabo'
  push:
    branches:
      - 'defend/sabo'

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- Test jobs (run in parallel with security scans) -----

  backend-test:
    name: Backend test (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven test
        run: mvn -B test

  frontend-test:
    name: Frontend test (install + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
        continue-on-error: true

  # ----- Security scan jobs (run in parallel with tests, gate the build) -----

  snyk-scan:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Install frontend dependencies for lockfile resolution
        working-directory: cicd_practice/frontend
        run: npm install --no-audit --no-fund

      - name: Snyk test - frontend (npm) JSON
        continue-on-error: true
        working-directory: cicd_practice/frontend
        run: |
          snyk test \
            --severity-threshold=high \
            --json-file-output=../../snyk-frontend.json \
            || echo "snyk-frontend reported vulnerabilities (exit=$?)"

      - name: Snyk test - backend (maven) JSON
        continue-on-error: true
        working-directory: cicd_practice/backend
        run: |
          snyk test \
            --severity-threshold=high \
            --all-projects \
            --json-file-output=../../snyk-backend.json \
            || echo "snyk-backend reported vulnerabilities (exit=$?)"

      - name: Generate human-readable Snyk markdown report
        run: |
          python3 .github/scripts/snyk-to-markdown.py \
            --frontend snyk-frontend.json \
            --backend snyk-backend.json \
            --output snyk-report.md

      - name: Upload Snyk JSON + markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: |
            snyk-frontend.json
            snyk-backend.json
            snyk-report.md
          if-no-files-found: warn

      - name: Post Snyk report as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: snyk-report
          path: snyk-report.md

      - name: Fail job on high or critical findings
        run: |
          fail=0
          for f in snyk-frontend.json snyk-backend.json; do
            if [ ! -s "$f" ]; then
              echo "::warning::$f missing or empty"
              continue
            fi
            count=$(python3 -c "import json,sys; d=json.load(open('$f')); projs=d if isinstance(d,list) else [d]; print(sum(1 for p in projs for v in p.get('vulnerabilities',[]) if v.get('severity') in ('high','critical')))")
            echo "$f: $count high/critical findings"
            if [ "$count" -gt 0 ]; then fail=1; fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "::error::Snyk found high or critical vulnerabilities. Failing build."
            exit 1
          fi

  owasp-dependency-check:
    name: OWASP Dependency-Check (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: OWASP Dependency-Check (failBuildOnCVSS=7)
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: cicd_practice/backend/target/dependency-check-report.*
          if-no-files-found: ignore

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicd_practice/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: npm audit JSON
        if: always()
        run: npm audit --json > npm-audit.json || true
      - name: Fail on high
        run: npm audit --audit-level=high
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: cicd_practice/frontend/npm-audit.json
          if-no-files-found: ignore

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/java \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --severity ERROR \
            --severity WARNING \
            --error \
            --sarif --output semgrep.sarif \
            --json --output semgrep.json \
            cicd_practice
      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: ignore

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs (CRITICAL/HIGH, fail)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: cicd_practice
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table
      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: cicd_practice
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs.sarif
          if-no-files-found: ignore

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----- Build jobs (gated by all security scans) -----

  backend-build:
    name: Backend build (mvn package)
    runs-on: ubuntu-latest
    needs:
      - snyk-scan
      - owasp-dependency-check
      - semgrep
      - trivy-fs
      - gitleaks
    defaults:
      run:
        working-directory: cicd_practice/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven package (tests already ran in parallel)
        run: mvn -B package -DskipTests
      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: cicd_practice/backend/target/*.jar
          if-no-files-found: ignore

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    needs:
      - snyk-scan
      - npm-audit
      - semgrep
      - trivy-fs
      - gitleaks
    defaults:
      run:
        working-directory: cicd_practice/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: cicd_practice/frontend/dist
          if-no-files-found: ignore

  # ----- Top-level PR summary -----

  pr-comment-summary:
    name: PR security summary
    needs:
      - backend-test
      - frontend-test
      - snyk-scan
      - owasp-dependency-check
      - npm-audit
      - semgrep
      - trivy-fs
      - gitleaks
      - backend-build
      - frontend-build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Compose summary
        id: compose
        run: |
          {
            echo "summary<<EOF"
            echo "## Security Audit Summary"
            echo ""
            echo "| Stage | Job | Result |"
            echo "| --- | --- | --- |"
            echo "| Test (parallel) | backend-test | ${{ needs.backend-test.result }} |"
            echo "| Test (parallel) | frontend-test | ${{ needs.frontend-test.result }} |"
            echo "| Security scan (parallel) | snyk-scan | ${{ needs.snyk-scan.result }} |"
            echo "| Security scan (parallel) | owasp-dependency-check | ${{ needs.owasp-dependency-check.result }} |"
            echo "| Security scan (parallel) | npm-audit | ${{ needs.npm-audit.result }} |"
            echo "| Security scan (parallel) | semgrep | ${{ needs.semgrep.result }} |"
            echo "| Security scan (parallel) | trivy-fs | ${{ needs.trivy-fs.result }} |"
            echo "| Security scan (parallel) | gitleaks | ${{ needs.gitleaks.result }} |"
            echo "| Build (after scans) | backend-build | ${{ needs.backend-build.result }} |"
            echo "| Build (after scans) | frontend-build | ${{ needs.frontend-build.result }} |"
            echo ""
            echo "Detailed Snyk findings are in the snyk-report comment above and the snyk-report artifact."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post summary comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-audit
          message: ${{ steps.compose.outputs.summary }}

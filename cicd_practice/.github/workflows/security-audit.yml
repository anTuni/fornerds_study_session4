name: Security Audit

on:
  pull_request:
    branches:
      - main
      - 'defend/**'
  push:
    branches:
      - 'defend/**'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

  frontend-audit:
    name: Frontend audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check npm vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Maven dependency scan
        working-directory: backend
        run: mvn -B org.owasp:dependency-check-maven:check
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep OWASP rules
        run: semgrep scan --config p/owasp-top-ten --config p/java --config p/typescript --sarif --output semgrep.sarif
      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  security-report:
    name: Security report
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-audit
      - dependency-check
      - semgrep
      - trivy
    if: always()
    steps:
      - name: Generate summary
        run: |
          cat > security-report.md <<'REPORT'
          # Security Audit Results

          This report summarizes automated security checks for the PR.

          | Job | Result |
          | --- | --- |
          | Backend tests | ${{ needs.backend-test.result }} |
          | Frontend audit | ${{ needs.frontend-audit.result }} |
          | OWASP Dependency-Check | ${{ needs.dependency-check.result }} |
          | Semgrep SAST | ${{ needs.semgrep.result }} |
          | Trivy filesystem scan | ${{ needs.trivy.result }} |

          Review failed jobs and uploaded artifacts before approving the PR.
          REPORT
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
